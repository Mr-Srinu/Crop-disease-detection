<!DOCTYPE html>
<html lang="en">

<head>
    <title>Signup - CropGuard AI</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../static/css/animate.css">

    <link rel="stylesheet" href="../static/css/owl.carousel.min.css">
    <link rel="stylesheet" href="../static/css/owl.theme.default.min.css">
    <link rel="stylesheet" href="../static/css/magnific-popup.css">

    <link rel="stylesheet" href="../static/css/flaticon.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <section class="ftco-appointment ftco-section img"
        style="background-image: url('../static/images/bg_3.jpg'); height: 100vh;">
        <div class="overlay"></div>
        <div class="container">
            <div class="row" style="justify-content: center;">
                <div class="col-md-6 half ftco-animate text-center">
                    <h2 class="mb-4 text-light">Join CropGuard AI</h2>
                    <p class="mb-4 text-light">Create an account to leverage state-of-the-art deep learning for
                        automated pathogen identification and localized crop health monitoring.</p>

                    {% if message %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert"
                        style="margin-bottom: 20px;">
                        <i class="fa fa-exclamation-circle"></i> {{ message }}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    {% endif %}

                    <form action="/signup" method="POST" enctype="multipart/form-data" class="appointment">
                        <div class="row">

                            <!-- User Name -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="text" name="user" class="form-control" placeholder="UserName" required>
                                </div>
                            </div>

                            <!-- Full Name -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="text" name="name" class="form-control" placeholder="Full Name"
                                        required>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="email" name="email" class="form-control" placeholder="Email Address"
                                        required>
                                </div>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="tel" name="mobile" class="form-control" placeholder="Phone Number"
                                        required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="col-md-12">
                                <div class="form-group">
                                    <input type="password" name="password" class="form-control" placeholder="Password"
                                        required>
                                </div>
                            </div>


                            <!-- Submit Button -->
                            <div class="col-md-12">
                                <div class="form-group">
                                    <button class="btn btn-primary py-3 px-4" type="submit">
                                        Sign Up
                                    </button>
                                </div>
                            </div>

                            <!-- Already have an account -->
                            <div class="col-md-12 text-light">
                                <p>Already have an account? <a href="/signin" class="text-warning">Login here</a></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>




    <!-- loader -->
    <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px">
            <circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee" />
            <circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10"
                stroke="#F96D00" />
        </svg></div>


    <script src="../static/js/jquery.min.js"></script>
    <script src="../static/js/jquery-migrate-3.0.1.min.js"></script>
    <script src="../static/js/popper.min.js"></script>
    <script src="../static/js/bootstrap.min.js"></script>
    <script src="../static/js/jquery.easing.1.3.js"></script>
    <script src="../static/js/jquery.waypoints.min.js"></script>
    <script src="../static/js/jquery.stellar.min.js"></script>
    <script src="../static/js/owl.carousel.min.js"></script>
    <script src="../static/js/jquery.magnific-popup.min.js"></script>
    <script src="../static/js/jquery.animateNumber.min.js"></script>
    <script src="../static/js/scrollax.min.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
    <script src="../static/js/google-map.js"></script>
    <script src="../static/js/main.js"></script>

</body>

</html>
